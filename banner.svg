<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" role="img" aria-label="Joseph Davidson, Computer Science student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <style>
      .name { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #fff; opacity: 0; animation: fade 1s ease forwards; }
      .role { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #93c5fd; opacity: 0; animation: fade 1s ease 0.6s forwards; }
      .code { font: 400 16px 'Courier New', monospace; fill: #38bdf8; opacity: 0; animation: fade 1s ease 1.2s forwards; }
      .cursor { fill: #38bdf8; animation: blink 1s steps(1) infinite; }
      @keyframes fade { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <text x="50" y="85" class="name">Joseph Davidson</text>
  <text x="50" y="125" class="role">Computer Science student | React · JavaScript · SQL</text>
  <text x="50" y="160" class="code">&gt; building, testing and debugging</text>
  <rect x="330" y="146" width="9" height="18" class="cursor"/>
</svg>
