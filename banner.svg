<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" role="img" aria-label="Joseph Davidson, Computer Science student, under a stormy sky with a wizard silhouette" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#3b4a6b"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .name { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .role { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #bfdbfe; }
      .tag  { font: 400 15px 'Courier New', monospace; fill: #7dd3fc; }
      .cloudA { animation: driftA 30s ease-in-out infinite alternate; }
      .cloudB { animation: driftB 40s ease-in-out infinite alternate; }
      .bolt1 { opacity: 0; animation: strike1 7s linear infinite; }
      .bolt2 { opacity: 0; animation: strike2 11s linear infinite 3s; }
      .flash { opacity: 0; animation: flash1 7s linear infinite; }
      .flash2 { opacity: 0; animation: flash2 11s linear infinite 3s; }
      .orb { animation: pulse 2.5s ease-in-out infinite; }
      @keyframes driftA { from { transform: translateX(-25px); } to { transform: translateX(25px); } }
      @keyframes driftB { from { transform: translateX(30px); } to { transform: translateX(-30px); } }
      @keyframes strike1 { 0%,58%,64%,100% { opacity: 0; } 59%,61% { opacity: 1; } 60% { opacity: .2; } 62% { opacity: .9; } }
      @keyframes flash1 { 0%,58%,64%,100% { opacity: 0; } 59%,61% { opacity: .28; } 60% { opacity: .05; } 62% { opacity: .2; } }
      @keyframes strike2 { 0%,40%,45%,100% { opacity: 0; } 41%,43% { opacity: 1; } 42% { opacity: .3; } }
      @keyframes flash2 { 0%,40%,45%,100% { opacity: 0; } 41%,43% { opacity: .22; } 42% { opacity: .05; } }
      @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- sky -->
  <rect width="900" height="240" rx="14" fill="url(#sky)"/>

  <!-- back clouds -->
  <g class="cloudB" filter="url(#blur)" fill="#4b5b7e" opacity="0.8">
    <ellipse cx="180" cy="40" rx="150" ry="34"/>
    <ellipse cx="420" cy="30" rx="170" ry="38"/>
    <ellipse cx="700" cy="45" rx="160" ry="34"/>
  </g>

  <!-- lightning bolts -->
  <g class="bolt1" filter="url(#glow)" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M610 20 L588 82 L614 82 L584 150 L600 150 L572 205"/>
    <path d="M588 82 L566 108"/>
  </g>
  <g class="bolt2" filter="url(#glow)" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M470 20 L452 70 L474 70 L448 130 L462 130 L440 180"/>
  </g>

  <!-- front clouds -->
  <g class="cloudA" filter="url(#blur)" fill="#2b3552" opacity="0.95">
    <ellipse cx="90" cy="18" rx="130" ry="30"/>
    <ellipse cx="330" cy="14" rx="150" ry="30"/>
    <ellipse cx="560" cy="16" rx="140" ry="32"/>
    <ellipse cx="800" cy="14" rx="150" ry="32"/>
  </g>

  <!-- flashes lighting the sky -->
  <rect class="flash" width="900" height="240" rx="14" fill="#dbeafe"/>
  <rect class="flash2" width="900" height="240" rx="14" fill="#dbeafe"/>

  <!-- hill -->
  <path d="M0 240 L0 222 Q220 200 430 220 T900 208 L900 240 Z" fill="#070b16"/>

  <!-- wizard silhouette -->
  <g fill="#070b16">
    <path d="M742 208 L748 140 Q765 130 782 140 L790 208 Z"/>
    <path d="M744 140 Q762 100 772 52 Q778 80 792 140 Z"/>
    <ellipse cx="768" cy="140" rx="30" ry="6"/>
    <path d="M782 152 L802 142 L804 148 L786 162 Z"/>
  </g>
  <path d="M754 144 Q768 190 760 206 Q774 180 782 144 Z" fill="#cbd5e1" opacity="0.8"/>
  <line x1="804" y1="70" x2="804" y2="210" stroke="#1a2236" stroke-width="4" stroke-linecap="round"/>
  <circle class="orb" cx="804" cy="64" r="8" fill="#7dd3fc" filter="url(#glow)"/>

  <!-- text -->
  <text x="50" y="110" class="name">Joseph Davidson</text>
  <text x="50" y="148" class="role">Computer Science student</text>
  <text x="50" y="182" class="tag">React · JavaScript · SQL · Bash</text>
</svg>
